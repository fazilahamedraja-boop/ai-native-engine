<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AI-Native Engine — Phase 1</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0b1020;
        color: #cfd6ea;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      #app {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
      }
      canvas {
        display: block;
        max-width: 100%;
        max-height: 100%;
      }
      #errors {
        position: fixed;
        left: 12px;
        right: 12px;
        bottom: 12px;
        max-height: 40vh;
        overflow: auto;
        padding: 10px 12px;
        border-radius: 8px;
        background: #2a1220;
        border: 1px solid #b3446a;
        color: #ffb3c8;
        font-size: 12px;
        line-height: 1.5;
        white-space: pre-wrap;
        display: none;
      }
      #errors.visible {
        display: block;
      }
      #hint {
        position: fixed;
        left: 12px;
        top: 12px;
        font-size: 11px;
        color: #55628a;
        user-select: none;
      }
      #info {
        position: fixed;
        left: 12px;
        bottom: 12px;
        font-size: 11px;
        color: #55628a;
        user-select: none;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="hint">WASD move · space jump · drag orbit · wheel zoom</div>
    <div id="info"></div>
    <div id="errors"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
