<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AI-Native Engine</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0b1020;
        color: #cfd6ea;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      #app {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
      }
      canvas {
        display: block;
        max-width: 100%;
        max-height: 100%;
      }
      #errors {
        position: fixed;
        left: 12px;
        right: 12px;
        bottom: 12px;
        max-height: 40vh;
        overflow: auto;
        padding: 10px 12px;
        border-radius: 8px;
        background: #2a1220;
        border: 1px solid #b3446a;
        color: #ffb3c8;
        font-size: 12px;
        line-height: 1.5;
        white-space: pre-wrap;
        display: none;
      }
      #errors.visible {
        display: block;
      }
      #hint {
        position: fixed;
        left: 12px;
        top: 12px;
        font-size: 11px;
        color: #55628a;
        user-select: none;
      }
      #info {
        position: fixed;
        left: 12px;
        bottom: 12px;
        font-size: 11px;
        color: #55628a;
        user-select: none;
      }
      #hud {
        position: fixed;
        left: 50%;
        bottom: 24px;
        transform: translateX(-50%);
        min-width: 280px;
        padding: 12px 18px;
        border: 1px solid #3a5a78;
        border-radius: 10px;
        background: rgba(7, 17, 31, 0.88);
        color: #dbe9ff;
        font-size: 13px;
        line-height: 1.55;
        text-align: center;
        white-space: pre-line;
        pointer-events: none;
        user-select: none;
        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.35);
      }
      #hud[hidden] {
        display: none;
      }
      #hud[data-phase='return'] {
        border-color: #c9a84f;
        color: #ffe7a6;
      }
      #hud[data-phase='won'] {
        border-color: #4fc98b;
        color: #b6ffd9;
      }
      #hud[data-phase='lost'] {
        border-color: #b3446a;
        color: #ffb3c8;
      }
      #hud[data-phase='error'] {
        border-color: #b3446a;
        color: #ffb3c8;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="hint">WASD move · space jump · drag orbit · wheel zoom</div>
    <div id="hud" hidden></div>
    <div id="info"></div>
    <div id="errors"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
